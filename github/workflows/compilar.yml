name: Compilar ROM SNES

on:
  workflow_dispatch:
  push:
    paths:
      - 'red_atack.asm'
      - '.github/workflows/compilar.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4

      - name: Instalar ferramentas de compilação
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make git

      - name: Baixar e compilar o ASAR oficial
        run: |
          git clone --depth 1 https://github.com/RPGHacker/asar.git asar-src
          cmake -S asar-src/src -B asar-src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build asar-src/build --config Release --parallel 2
          ASAR_BIN="$(find asar-src/build -type f -name asar -perm -111 | head -n 1)"
          test -n "$ASAR_BIN"
          "$ASAR_BIN" --version
          echo "ASAR_BIN=$ASAR_BIN" >> "$GITHUB_ENV"

      - name: Montar ROM e verificar resultado
        run: |
          "$ASAR_BIN" red_atack.asm red_atack.sfc
          test -s red_atack.sfc
          file red_atack.sfc
          ls -lh red_atack.sfc

      - name: Guardar ROM compilada
        uses: actions/upload-artifact@v4
        with:
          name: red-atack-sfc
          path: red_atack.sfc
          if-no-files-found: error
          
